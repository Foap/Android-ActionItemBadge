afterEvaluate {
    publishing {
        publications {
            create("release", MavenPublication) {
                groupId = 'com.github.Foap'
                artifactId = 'Android-ActionItemBadge'
                version = '1.0.15'

                // This ensures the actual AAR gets published
                artifact("$buildDir/outputs/aar/${project.name}-release.aar")
            }
        }
    }
}